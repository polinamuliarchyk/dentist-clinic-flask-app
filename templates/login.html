<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DentalCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="card auth-card">
            <div class="card-header">
                <h2 class="card-title">Welcome Back</h2>
                <p class="card-description">Enter your credentials to access your account</p>
            </div>
            <div class="card-content">
                <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="form-error" style="display: block; margin-bottom: 15px; color: #d93025;">
                              {{ message }}
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input class="form-input" type="tel" id="phone" name="phone" placeholder="111222333" required>
                        <div class="form-error" id="phoneError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required>
                        <div class="form-error" id="passwordError"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>
            </div>
            <div class="card-footer">
                <p style="font-size: 0.875rem; color: rgba(26, 26, 26, 0.7);">
                    Don't have an account?
                    <a href="{{ url_for('client.client_registration') }}" style="color: var(--primary); text-decoration: none;">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const phone = document.getElementById('phone');
            const password = document.getElementById('password');
            const phoneError = document.getElementById('phoneError');
            const passwordError = document.getElementById('passwordError');

            phoneError.textContent = '';
            passwordError.textContent = '';
            phone.classList.remove('error');
            password.classList.remove('error');

            let hasError = false;

            if (!phone.value || phone.value.length < 9) {
                phoneError.textContent = 'Please enter a valid phone number';
                phone.classList.add('error');
                hasError = true;
            }

            if (!password.value || password.value.length < 4) {
                passwordError.textContent = 'Password is too short';
                password.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
